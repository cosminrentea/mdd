[package]
name = "mdd"
version = "0.2.1"
readme = "README.md"
edition = "2024"
rust-version = "1.88"
authors = ["Cosmin Rentea <cosminrentea@gmail.com>"]
description = "Markdown-Driven Development -- structural queries for coding agents"
license = "MIT"
repository = "https://github.com/cosminrentea/mdd"
keywords = ["markdown", "cli", "agent", "documentation"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# CLI framework (derive macros for zero-boilerplate argument parsing)
clap = { version = "4", features = ["derive"] }

# Markdown parsing (pulldown-cmark: fastest, byte offsets, multi-part support)
pulldown-cmark = { version = "0.13", default-features = false }

# YAML frontmatter
serde_norway = "0.9"
serde_json = "1"

# Directory walking (.gitignore-aware, parallel)
ignore = "0.4"

# Date parsing and comparison
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Pattern matching
regex = "1"

# Error reporting with source context
miette = { version = "7", features = ["fancy"] }
thiserror = "2"


# Terminal coloring
owo-colors = "4"

[target.'cfg(unix)'.dependencies]
# Reset SIGPIPE so a closed stdout pipe ends the process quietly
libc = "0.2"

[dev-dependencies]
# Snapshot testing
insta = "1"

# Integration test helpers
assert_cmd = "2"
predicates = "3"

# Temporary directories for tests
tempfile = "3"

# Property-based / fuzz testing
proptest = "1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
# Structural, revisited with later refactors
needless_pass_by_value = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Statistics and display arithmetic
cast_precision_loss = "allow"
